name: Tests by Maria and Sophie

on:
  push:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: inventory-management

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare additional tests
        run: |
          cp tests/test_coverage_b tests/test_coverage_b_temp.py
          cp tests/test_notif_failure tests/test_notif_failure_temp.py

      - name: Run tests with coverage
        run: |
          python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90